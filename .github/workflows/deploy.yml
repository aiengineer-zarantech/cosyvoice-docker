name: Build and Push Docker Image

# 1. TRIGGER: Yeh workflow kab chalega?
on:
  push:
    branches: [ "main" ]  # Jab bhi 'main' branch par code push ho
  workflow_dispatch:      # + GitHub dashboard se manual 'Run' button dabane par

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Microsoft ka free Ubuntu server allocate hoga

    steps:
      # Step A: Code ko cloud VM me lekar aao
      - name: Checkout code
        uses: actions/checkout@v4

      # Step B: Docker Hub par securely login karo
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step C: Docker image build karo aur Hub par push kar do
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cosyvoice-runpod:v1